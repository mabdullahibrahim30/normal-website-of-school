<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooling Fan</title>
</head>
<link rel="stylesheet" href="customize.css">

<body>
    <div class="box">
        <div class="img">
            <img src="fen.png" alt="Fan">
        </div>
        <form>
            <input type="radio" name="fanspeed" id="stop">
            <label for="stop " id="stop_active">stop</label>
        </form>
        <form>
            <input type="radio" name="fanspeed" id="slow">
            <label for="slow " id="slow_active">slow</label>
        </form>
        <form>
            <input type="radio" name="fanspeed" id="fast">
            <label for="fast " id="fast_active">fast</label>
        </form>
        <form>
            <input type="radio" name="fanspeed" id="veryfast">
            <label for="veryfast " id="veryfast_active">very fast</label>
        </form>
    </div>
</body>

</html>
